<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vynk UI Continuous Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { background-color: #030014; overflow-x: hidden; font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
        
        .orb {
            background: radial-gradient(circle, #ff2a85 0%, #8a2be2 60%, rgba(255,255,255,0) 100%);
            filter: blur(8px);
            box-shadow: 0 0 40px rgba(255, 42, 133, 0.4);
        }

        .glow-text {
            background: linear-gradient(to right, #ff2a85, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const PhoneMockup = ({ variant }) => (
            <div className="w-[280px] h-[580px] bg-[#0b0c10] border-[6px] border-[#1f2029] rounded-[44px] shadow-[0_0_40px_-10px_rgba(138,43,226,0.15)] overflow-hidden flex flex-col relative">
                
                <div className="flex justify-between items-center px-5 pt-3 mb-6 text-[13px] font-bold text-white z-10">
                    <span>9:41</span>
                    <div className="w-20 h-6 bg-black rounded-full absolute left-1/2 -translate-x-1/2 border border-white/5"></div>
                    <div className="flex gap-1.5 items-center">
                        <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21l-12-18h24z"/></svg>
                        <svg className="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M22 10v4"/></svg>
                    </div>
                </div>

                <div className="flex-1 flex flex-col px-5 relative">
                    {variant === 'orb' ? (
                        <div className="flex-1 flex flex-col items-center justify-center text-center pb-10">
                            <div className="w-36 h-36 orb rounded-full mb-6 opacity-90 animate-pulse"></div>
                            <h2 className="text-[22px] font-bold text-white leading-tight">How can I help<br/>you today?</h2>
                        </div>
                    ) : (
                        <div className="flex-1 flex flex-col pt-4">
                            <div className="flex items-center gap-2 mb-10">
                                <svg className="w-5 h-5 text-pink-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                                <span className="text-[13px] font-bold text-pink-500">Chat GPT GO</span>
                            </div>
                            <h1 className="text-[32px] font-bold text-white leading-[1.1] mb-1">Hello Saad,</h1>
                            <h2 className="text-[32px] font-bold text-gray-400 leading-[1.1]">How can I help<br/>you today?</h2>
                        </div>
                    )}

                    <div className="absolute bottom-6 left-5 right-5 bg-[#181a25] border border-white/5 rounded-full py-3.5 px-4 flex items-center text-gray-500 text-sm font-medium">
                        <span className="mr-2 text-lg font-normal leading-none text-pink-500">+</span> Ask anything...
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [step, setStep] = useState(0);
            const [isAudioPlaying, setIsAudioPlaying] = useState(false);
            
            const audioRef = useRef(null);

            useEffect(() => {
                if (!audioRef.current) {
                    audioRef.current = new Audio('C:\Users\manoj\OneDrive\Desktop\redesign\hero design\TunePocket-Top-Professional-Intro-Preview (1).mp3'); 
                    audioRef.current.loop = true;
                    audioRef.current.volume = 0.4;
                }
            }, []);

            const toggleAudio = () => {
                if (isAudioPlaying) {
                    audioRef.current.pause();
                } else {
                    audioRef.current.play();
                }
                setIsAudioPlaying(!isAudioPlaying);
            };

            useEffect(() => {
                const t1 = setTimeout(() => setStep(1), 100);
                const t2 = setTimeout(() => setStep(2), 1200);
                const t3 = setTimeout(() => setStep(3), 2200);

                return () => {
                    clearTimeout(t1);
                    clearTimeout(t2);
                    clearTimeout(t3);
                };
            }, []);

            const getLeftPhoneStyles = () => {
                if (step === 0) return "translate-y-[100vh] scale-[0.95] z-20 opacity-0";
                if (step === 1) return "translate-y-[80px] scale-[0.95] z-20 opacity-100";
                if (step === 2) return "translate-y-[40px] scale-[0.95] z-20 opacity-0 pointer-events-none";
                return "-translate-x-[320px] translate-y-0 scale-100 z-20 opacity-100";
            };

            const getCenterPhoneStyles = () => {
                if (step === 0) return "translate-y-[100vh] scale-100 z-30 opacity-0";
                if (step === 1) return "translate-y-0 scale-100 z-30 opacity-100";
                if (step === 2) return "translate-y-0 scale-100 z-30 opacity-100";
                return "translate-y-0 scale-[1.05] z-30 opacity-100";
            };

            const getRightPhoneStyles = () => {
                if (step === 0) return "translate-y-[100vh] scale-[0.9] z-10 opacity-0";
                if (step === 1) return "translate-y-[160px] scale-[0.9] z-10 opacity-100";
                if (step === 2) return "translate-y-[80px] scale-[0.9] z-10 opacity-0 pointer-events-none";
                return "translate-x-[320px] translate-y-0 scale-100 z-20 opacity-100";
            };

            return (
                <div className="min-h-screen w-full relative flex flex-col items-center bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#130a2a] via-[#030014] to-black">
                    
                    <button 
                        onClick={toggleAudio}
                        className="fixed bottom-6 right-6 z-50 bg-white/10 backdrop-blur-md border border-white/20 text-white px-4 py-3 rounded-full flex items-center gap-2 hover:bg-white/20 transition-all shadow-[0_0_15px_rgba(255,42,133,0.3)]"
                    >
                        {isAudioPlaying ? (
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 19V5l7-3v20l-7-3z" /></svg>
                        ) : (
                            <svg className="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clipRule="evenodd" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>
                        )}
                        <span className="text-sm font-medium">{isAudioPlaying ? 'Sound On' : 'Sound Off'}</span>
                    </button>

                    <div className="w-full flex justify-center pt-6 z-50">
                        <nav className="bg-white/5 backdrop-blur-md border border-white/10 rounded-full px-2 py-2 flex items-center justify-between w-[700px] max-w-[90vw] shadow-lg">
                            <div className="flex items-center gap-6 text-[13px] text-gray-400 font-medium">
                                <div className="w-8 h-8 bg-gradient-to-tr from-[#ff2a85] to-[#8a2be2] rounded-full ml-1"></div>
                                <span className="hover:text-white cursor-pointer transition-colors">Components</span>
                                <span className="hover:text-white cursor-pointer transition-colors">Snippets</span>
                                <span className="hover:text-white cursor-pointer transition-colors">Templates</span>
                            </div>
                            <div className="pr-5 text-[13px] text-gray-200 hover:text-white cursor-pointer font-medium transition-colors">
                                Try for Free
                            </div>
                        </nav>
                    </div>

                    <div className={`absolute top-[120px] w-full flex flex-col items-center transition-all duration-[800ms] ease-in-out ${step === 3 ? 'opacity-100 translate-y-0 delay-300' : 'opacity-0 -translate-y-8 pointer-events-none'}`}>
                        <div className="border border-white/10 rounded-full px-4 py-1.5 text-sm font-medium text-gray-400 bg-white/5 mb-8 shadow-sm backdrop-blur-sm">
                            Join Our Waitlist and <span className="text-white">claim instant offer</span>
                        </div>
                        <h1 className="text-[56px] font-extrabold tracking-tight mb-4 text-center leading-[1.1] text-white">
                            Transform Ideas into <span className="glow-text">Reality</span><br/>With Vynk
                        </h1>
                        <p className="text-gray-400 mb-8 max-w-xl text-center text-lg leading-relaxed">
                            Roll up beautiful UIs effortlessly by using Vynk CLI in minutes so that you can focus on building the core of your product.
                        </p>
                        <button className="bg-gradient-to-r from-[#ff2a85] to-[#8a2be2] text-white px-8 py-3.5 rounded-full font-semibold text-sm hover:opacity-90 transition-opacity shadow-[0_0_20px_rgba(255,42,133,0.4)]">
                            Try for Free
                        </button>
                    </div>

                    <div className={`relative flex justify-center w-full max-w-[1000px] transition-all duration-[1000ms] ease-[cubic-bezier(0.25,1,0.5,1)] ${step === 3 ? 'mt-[420px]' : 'mt-[100px]'}`}>
                        
                        <div className={`absolute transition-all duration-[1200ms] ease-[cubic-bezier(0.25,1,0.5,1)] ${getLeftPhoneStyles()}`}>
                            <PhoneMockup variant="text" />
                        </div>
                        
                        <div className={`absolute transition-all duration-[1200ms] ease-[cubic-bezier(0.25,1,0.5,1)] ${getRightPhoneStyles()}`}>
                            <PhoneMockup variant="text" />
                        </div>
                        
                        <div className={`absolute transition-all duration-[1200ms] ease-[cubic-bezier(0.25,1,0.5,1)] ${getCenterPhoneStyles()}`}>
                            <PhoneMockup variant="orb" />
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
